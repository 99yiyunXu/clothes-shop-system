spring.application.name=clothes-shop-system
spring.thymeleaf.cache=false

# 接続情報は環境変数で指定する
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/luna_shop?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:luna_app}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never

# アップロード画像はビルド出力の外に保存し、再起動後も保持する
shop.images.directory=${LUNA_IMAGE_DIR:${user.dir}/data/product-images}
shop.images.max-files=2000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


