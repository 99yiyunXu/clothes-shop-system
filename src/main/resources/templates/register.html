<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新規登録 | LUNA</title>
<link rel="stylesheet" th:href="@{/css/shop.css}">
</head>
<body>
<main class="container">
<section class="panel auth-panel">
<h1>新規ユーザー登録</h1>
<div th:replace="~{fragments/shop :: messages}">
</div>
<form th:action="@{/register}" method="post">
<label class="field">
<span>ユーザー名（半角英数字・下線）</span>
<input name="userName" th:value="${userName}" required minlength="3" maxlength="50" pattern="[a-zA-Z0-9_]{3,50}" autocomplete="username">
</label>
<label class="field">
<span>パスワード（8～64文字）</span>
<input type="password" name="password" required minlength="8" maxlength="64" autocomplete="new-password">
</label>
<label class="field">
<span>確認用パスワード</span>
<input type="password" name="confirmation" required minlength="8" maxlength="64" autocomplete="new-password">
</label>
<button type="submit">登録する</button>
</form>
<p>
<a th:href="@{/}">ログインへ戻る</a>
</p>
</section>
</main>
</body>
</html>
