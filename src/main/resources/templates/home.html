<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LUNA Clothes Shop</title>

<style>

/* 共通設定 */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #fff;
    color: #333;
}


/* ヘッダー */
.header {
    background-color: #fff;
    border-bottom: 1px solid #eee;
}

.header-main {
    max-width: 1200px;
    margin: auto;
    height: 80px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;
}

.logo {
    font-family: Georgia, serif;
    font-size: 34px;
    letter-spacing: 6px;
}

.search {
    width: 350px;
    display: flex;
}

.search input {
    width: 100%;
    padding: 11px 15px;

    border: 1px solid #ccc;
    border-radius: 20px 0 0 20px;
}

.search button {
    border: none;
    padding: 0 20px;

    background-color: #8b8f63;
    color: white;

    border-radius: 0 20px 20px 0;
}

.header-menu a {
    margin-left: 20px;

    text-decoration: none;
    color: #444;

    font-size: 14px;
}


/* ナビゲーション */
.nav {
    border-top: 1px solid #eee;
}

.nav-inner {
    max-width: 1000px;
    height: 50px;

    margin: auto;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 35px;
}

.nav-inner a {
    color: #333;
    text-decoration: none;

    font-size: 14px;
}


/* メインバナー */
.main-banner {
    width: 100%;
    aspect-ratio: 3 / 1;
    position: relative;
    overflow: hidden;
    background-color: #f3f1eb;
}

.main-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

.banner-text {
    position: absolute;

    top: 50%;
    left: 10%;

    transform: translateY(-50%);

    max-width: 400px;
}

.banner-subtitle {
    color: #8b8f63;

    font-size: 13px;
    letter-spacing: 2px;
}

.banner-text h1 {
    font-family: Georgia, serif;

    font-size: 46px;

    margin: 12px 0;
}

.banner-text p {
    line-height: 1.8;

    color: #666;
}

.banner-button {
    display: inline-block;

    margin-top: 15px;

    padding: 12px 24px;

    background-color: #8b8f63;
    color: white;

    text-decoration: none;
}


/* サービス */
.service-area {
    max-width: 1100px;

    margin: auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    border-bottom: 1px solid #eee;
}

.service {
    padding: 25px;

    text-align: center;

    border-right: 1px solid #eee;
}

.service:last-child {
    border-right: none;
}

.service-title {
    font-weight: bold;

    font-size: 14px;
}

.service-text {
    margin-top: 6px;

    color: #888;

    font-size: 12px;
}


/* コンテンツ */
.container {
    max-width: 1100px;

    margin: 50px auto;

    padding: 0 20px;
}

.section-title {
    text-align: center;

    font-size: 24px;

    margin-bottom: 30px;
}


/* 商品 */
.product-grid {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 20px;
}

.product-card {
    background-color: white;
}

.product-image {
    width: 100%;

    aspect-ratio: 3 / 4;

    object-fit: cover;

    background-color: #f4f4f4;
}

.product-name {
    margin-top: 12px;

    font-size: 14px;
}

.product-price {
    margin-top: 7px;

    font-weight: bold;
}


/* サブバナー */
.sub-banner-area {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 20px;

    margin-top: 50px;
}

.sub-banner {
    position: relative;

    height: 200px;

    overflow: hidden;

    background-color: #f3f1eb;
}

.sub-banner img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.sub-banner-text {
    position: absolute;

    top: 50%;
    left: 30px;

    transform: translateY(-50%);
}

.sub-banner-text h3 {
    font-family: Georgia, serif;

    font-size: 25px;

    margin: 5px 0;
}


/* カテゴリー */
.category-area {
    margin-top: 60px;
}

.category-list {
    display: flex;

    justify-content: center;

    gap: 30px;
}

.category-item {
    text-align: center;

    width: 120px;
}

.category-item img {
    width: 100px;
    height: 100px;

    object-fit: cover;

    border-radius: 50%;
}

.category-item p {
    font-size: 13px;
}


/* スマートフォン */
@media screen and (max-width: 700px) {

    .header-main {
        height: auto;

        padding: 15px;

        flex-wrap: wrap;

        gap: 15px;
    }

    .search {
        width: 100%;
        order: 3;
    }

    .header-menu {
        font-size: 12px;
    }

    .nav-inner {
        justify-content: flex-start;

        overflow-x: auto;

        padding: 0 15px;
    }

    .nav-inner a {
        white-space: nowrap;
    }

    .main-banner {
        height: 330px;
    }

    .banner-text {
        left: 7%;

        max-width: 250px;
    }

    .banner-text h1 {
        font-size: 32px;
    }

    .service-area {
        grid-template-columns: repeat(2, 1fr);
    }

    .product-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .sub-banner-area {
        grid-template-columns: 1fr;
    }

    .category-list {
        justify-content: flex-start;

        overflow-x: auto;
    }

    .category-item {
        min-width: 100px;
    }
}

</style>

</head>

<body>


<header class="header">

    <div class="header-main">

        <div class="logo">
            LUNA
        </div>


        <!-- 商品検索 -->
        <div class="search">

            <input
                type="text"
                placeholder="商品を検索">

            <button>
                検索
            </button>

        </div>


        <div class="header-menu">

            <a href="#">お気に入り</a>

            <a href="#">カート</a>

            <a href="/logout">
                ログアウト
            </a>

        </div>

    </div>


    <nav class="nav">

        <div class="nav-inner">

            <a href="/home">
                ホーム
            </a>

            <a href="#">
                新着商品
            </a>

            <a href="#">
                レディース
            </a>

            <a href="#">
                メンズ
            </a>

            <a href="#">
                アクセサリー
            </a>

            <a href="#">
                SALE
            </a>

        </div>

    </nav>

</header>



<!-- メインバナー -->
<section class="main-banner">

    <img id="randomBanner"
         src="/images/woman1.png"
         alt="LUNA メインバナー">

</section>



<!-- サービス -->
<section class="service-area">

    <div class="service">

        <div class="service-title">
            高品質
        </div>

        <div class="service-text">
            厳選された商品
        </div>

    </div>


    <div class="service">

        <div class="service-title">
            送料無料
        </div>

        <div class="service-text">
            条件を満たした注文が対象
        </div>

    </div>


    <div class="service">

        <div class="service-title">
            返品対応
        </div>

        <div class="service-text">
            安心してお買い物
        </div>

    </div>


    <div class="service">

        <div class="service-title">
            安全な決済
        </div>

        <div class="service-text">
            安全なショッピング
        </div>

    </div>

</section>



<main class="container">


	<!-- 新着商品 -->
	<h2 class="section-title">
	    新着商品
	</h2>

	<div class="product-grid">

	    <div class="product-card"
	         th:each="product : ${newProducts}">

	        <img
	            class="product-image"
	            th:src="${product.imageUrl}"
	            th:alt="${product.name}">

	        <div class="product-name"
	             th:text="${product.name}">
	        </div>

	        <div class="product-price">
	            ¥<span th:text="${product.price}"></span>
	        </div>

	    </div>

	</div>
	<!-- おすすめ商品 -->
	<h2 class="section-title">
	    おすすめ商品
	</h2>

	<div class="product-grid">

	    <div class="product-card"
	         th:each="product : ${recommendedProducts}">

	        <img
	            class="product-image"
	            th:src="${product.imageUrl}"
	            th:alt="${product.name}">

	        <div class="product-name"
	             th:text="${product.name}">
	        </div>

	        <div class="product-price">
	            ¥<span th:text="${product.price}"></span>
	        </div>

	    </div>

	</div>


            <img
                class="product-image"
                th:src="${product.imageUrl}"
                th:alt="${product.name}">


            <div
                class="product-name"
                th:text="${product.name}">
            </div>


            <div class="product-price">

                ¥<span
                    th:text="${product.price}">
                </span>

            </div>

        </div>

    </div>



    <!-- キャンペーンバナー -->
    <div class="sub-banner-area">

        <!-- バナー情報をバックエンドから表示する -->
        <div
            class="sub-banner"
            th:each="banner : ${subBanners}">


            <img
                th:src="${banner.imageUrl}"
                alt="キャンペーン">


            <div class="sub-banner-text">

                <p
                    th:text="${banner.subTitle}">
                </p>


                <h3
                    th:text="${banner.title}">
                </h3>

            </div>

        </div>

    </div>



    <!-- カテゴリー -->
    <section class="category-area">

        <h2 class="section-title">
            カテゴリーから探す
        </h2>


        <div class="category-list">


            <!-- カテゴリーをバックエンドから表示する -->
            <div
                class="category-item"
                th:each="category : ${categories}">


                <img
                    th:src="${category.imageUrl}"
                    th:alt="${category.name}">


                <p
                    th:text="${category.name}">
                </p>

            </div>

        </div>

    </section>


</main>
<script>
document.addEventListener("DOMContentLoaded", function () {

    fetch("/api/random-image")
        .then(response => response.text())
        .then(imageUrl => {
            document.getElementById("randomBanner").src = imageUrl;
        });

});
</script>
</body>

</html>
