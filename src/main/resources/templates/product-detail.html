<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${product.name + ' | LUNA'}">
</title>
<link rel="stylesheet" th:href="@{/css/shop.css}">
<script th:src="@{/js/product-images.js}" th:attr="data-fallback=@{/images/common/no-image.svg}"></script>
</head>
<body>
<header th:replace="~{fragments/shop :: header}">
</header>
<main class="container">
<div th:replace="~{fragments/shop :: messages}">
</div>
<p>
<a th:href="@{/products}">商品一覧へ戻る</a>
</p>
<section class="detail-grid">
<img class="detail-image" data-product-image th:src="@{${productImages.resolve(product.imageUrl)}}" th:alt="${product.name}">
<div>
<p class="muted" th:text="${product.category}">
</p>
<h1 th:text="${product.name}">
</h1>
<span class="badge" th:if="${product.sale}">SALE</span>
<h2 th:text="|¥${#numbers.formatInteger(product.price, 1, 'COMMA')}|">
</h2>
<p class="description" th:text="${product.description}">
</p>
<p th:text="|在庫：${product.stock}点|">
</p>
<form th:if="${product.stock > 0}" th:action="@{/cart/add}" method="post" class="actions">
<input type="hidden" name="productId" th:value="${product.id}">
<label>数量 <input class="quantity" type="number" name="quantity" value="1" min="1" th:max="${product.stock < 99 ? product.stock : 99}" required>
</label>
<button type="submit">カートに追加</button>
</form>
<p th:if="${product.stock == 0}">売り切れです。</p>
<form class="actions" th:if="${!favorite}" th:action="@{/favorites/{id}/add(id=${product.id})}" method="post">
<button class="secondary" type="submit">お気に入りに追加</button>
</form>
<form class="actions" th:if="${favorite}" th:action="@{/favorites/{id}/remove(id=${product.id})}" method="post">
<button class="secondary" type="submit">お気に入りを解除</button>
</form>
</div>
</section>
</main>
</body>
</html>
