<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お気に入り | LUNA</title>
<link rel="stylesheet" th:href="@{/css/shop.css}">
<script th:src="@{/js/product-images.js}" th:attr="data-fallback=@{/images/common/no-image.svg}"></script>
</head>
<body>
<header th:replace="~{fragments/shop :: header}">
</header>
<main class="container">
<h1>お気に入り</h1>
<p class="empty" th:if="${favoritePage.empty}">お気に入りの商品がありません。</p>
<div class="product-grid">
<article th:each="favorite : ${favoritePage.content}" th:with="product=${favorite.product}">
<a th:href="@{/products/{id}(id=${product.id})}">
<img class="product-image" data-product-image th:src="@{${productImages.resolve(product.imageUrl)}}" th:alt="${product.name}">
<p class="product-name" th:text="${product.name}">
</p>
</a>
<p class="product-price" th:text="|¥${#numbers.formatInteger(product.price, 1, 'COMMA')}|">
</p>
<form th:action="@{/favorites/{id}/remove(id=${product.id})}" method="post">
<button class="secondary" type="submit">解除</button>
</form>
</article>
</div>
<nav th:replace="~{fragments/shop :: pagination(${favoritePage}, '/favorites')}">
</nav>
</main>
</body>
</html>
