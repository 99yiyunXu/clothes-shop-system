<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
    <title>Luna Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #f5eee6,
                #d7c4b5
            );

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;

            background-color: white;

            padding: 45px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            font-size: 36px;
            letter-spacing: 6px;
            margin-bottom: 5px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 35px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;

            color: #555;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #8c7564;
        }

        button {
            width: 100%;

            margin-top: 28px;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background-color: #5e4b3c;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background-color: #45362c;
        }

        .error {
            background-color: #ffeaea;
            color: #d33;

            padding: 10px;

            margin-top: 15px;

            border-radius: 7px;

            text-align: center;

            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            font-size: 12px;
        }
		
		/* スマートフォン画面 */
		@media screen and (max-width: 600px) {

		    body {
		        padding: 20px;
		    }

		    .login-box {
		        width: 100%;
		        max-width: 360px;
		        padding: 30px 25px;
		    }

		    .logo {
		        font-size: 30px;
		    }

		    .subtitle {
		        font-size: 14px;
		    }

		    input {
		        font-size: 16px;
		        padding: 14px;
		    }

		    button {
		        font-size: 16px;
		        padding: 14px;
		    }
		}

    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        LUNA
    </div>

    <div class="subtitle">
        アパレルショップ管理システム
    </div>


<!--   <form action="/login" method="post">-->

        <label>
            ユーザーID
        </label>

        <input
		    id="userName"
            type="text"
            name="userName"
            placeholder="ユーザーIDを入力してください"
            
        >


        <label>
            パスワード
        </label>

        <input
		    id="password"
            type="password"
            name="password"
            placeholder="パスワードを入力してください"
           
        >


		<button id="btnTest" type="button">
		    ログイン
		</button>

<!--    </form>-->


    <div
        th:if="${error}"
        th:text="${error}"
        class="error">
    </div>


    <div class="footer">
        © 2026 LUNA Clothes Shop
    </div>

	
</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<script>
	$(document).ready(function () {

	    $("#btnTest").click(function () {

	        let userName = $("#userName").val();
	        let password = $("#password").val();
			
		//
			if (userName == "" || password == "") {
			alert("ユーザー名とパスワードを入力してください。");
			        return;
			    }

	        console.log(userName);
	        console.log(password);

	        $.ajax({
	            url: "/login",
	            type: "post",
	            data: {
	                userName: userName,
	                password: password
	            },

				success: function (data) {

				       if (data == "ok") {
				           window.location.href = "/home";
				       } else {
				           alert("ログイン失敗");
				       }
				   },
				   
	            error: function () {
	                alert("请求失败");
	            }
	        });

	    });

	});
	</script>

</body>
</html>
